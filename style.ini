; Feuille de style du thème Hacker pour DokuWiki
; Les placeholders permettent la compatibilité avec le plugin Styling et les extensions.

[stylesheets]
; Thème principal (style terminal vert sur noir)
css/hacker.css = screen

; Styles DokuWiki pour éditeur, diff, admin, médias, etc.
../dokuwiki/css/_imgdetail.css        = screen
../dokuwiki/css/_media_popup.css      = screen
../dokuwiki/css/_media_fullscreen.css = screen
../dokuwiki/css/_fileuploader.css     = screen
../dokuwiki/css/_tabs.css             = screen
../dokuwiki/css/_links.css            = screen
../dokuwiki/css/_toc.css              = screen
../dokuwiki/css/_footnotes.css        = screen
../dokuwiki/css/_search.less          = screen
../dokuwiki/css/_recent.css           = screen
../dokuwiki/css/_diff.css             = screen
../dokuwiki/css/_edit.css             = screen
../dokuwiki/css/_modal.css            = screen
../dokuwiki/css/_forms.css            = screen
../dokuwiki/css/_admin.less           = screen

; load the rest of the styles
css/structure.css                     = screen
css/design.css                        = screen
css/content.css                       = screen
css/includes.css                      = screen

css/mobile.css                        = all
css/print.css                         = print

[replacements]
; Placeholders garantis (compatibilité plugins)
; Main text color
__text__           = "#00ff00"
; Main background color
__background__     = "#000000"
; Alternative text color
__text_alt__       = "#00cc00"
; Alternative background color
__background_alt__ = "#001100"
; Neutral text color
__text_neu__       = "#009900"
; Neutral background color
__background_neu__ = "#003300"
; Border color
__border__         = "#00ff00"
; Highlight color (for search results mainly)
__highlight__      = "#003300"
; The general link color
__link__           = "#00ff00"
; The color for links to existing pages
__existing__       = "#00ff00"
; The color for links to non-existing pages
__missing__        = "#ff3333"
; Theme color of the web app
__theme_color__    = "#000000"
